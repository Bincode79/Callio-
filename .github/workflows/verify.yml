name: Kiểm tra

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Kiểm tra kiểu, lint và test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Kiểm tra kiểu
        run: npx tsc --noEmit

      - name: Lint
        run: npx biome lint src

      - name: Chạy test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Kiểm tra backend giọng nói
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/voice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Chỉ cài phần cần cho test: API + giả lập client. Engine thật (edge-tts,
      # faster-whisper) không cần vì test tiêm bản giả, giúp CI nhanh và ổn định.
      - name: Cài dependency cho test
        run: python -m pip install fastapi "uvicorn[standard]" python-multipart httpx

      - name: Chạy test API
        run: python -m unittest discover -s tests -t . -v
